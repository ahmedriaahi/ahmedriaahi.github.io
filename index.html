<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Riahi | Robotics & AI Engineer</title>
  <meta name="description" content="Ahmed Riahi — Étudiant ingénieur en mécatronique spécialisé en robotique autonome, vision par ordinateur et IA embarquée.">
  <meta name="keywords" content="Ahmed Riahi, Robotics, ROS2, Computer Vision, AI, SLAM, OpenCV, YOLOv8, Mechatronics">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">
  <style>
    :root{--bg:#0a0a0f;--bg2:#111118;--card:#16161f;--border:#2a2a3a;--accent:#6366f1;--accent2:#22d3ee;--text:#e2e8f0;--muted:#64748b;--green:#10b981;}
    [data-theme="light"]{--bg:#f8fafc;--bg2:#f1f5f9;--card:#ffffff;--border:#e2e8f0;--accent:#6366f1;--accent2:#0891b2;--text:#0f172a;--muted:#64748b;--green:#059669;}
    *{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;transition:background 0.3s,color 0.3s;}

    #progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;z-index:999;}

    nav{position:fixed;top:3px;width:100%;background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:100;padding:0.875rem 2rem;display:flex;justify-content:space-between;align-items:center;}
    [data-theme="light"] nav{background:rgba(248,250,252,0.9);}
    .nav-logo{font-family:'Fira Code',monospace;color:var(--accent2);font-size:1rem;}
    .nav-links{display:flex;gap:1.5rem;list-style:none;align-items:center;}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:0.85rem;transition:color 0.2s;}
    .nav-links a:hover{color:var(--accent2);}
    .nav-controls{display:flex;gap:0.5rem;}
    .ctrl-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.35rem 0.7rem;border-radius:6px;cursor:pointer;font-size:0.8rem;transition:all 0.2s;font-family:'Fira Code',monospace;}
    .ctrl-btn:hover{border-color:var(--accent2);color:var(--accent2);}

    #particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}

    /* HERO */
    .hero{min-height:100vh;display:flex;align-items:center;padding:6rem 4rem 4rem;position:relative;overflow:hidden;z-index:1;gap:4rem;}
    @media(max-width:480px){.hero{min-height:100svh;}}
    .hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(99,102,241,0.12) 0%,transparent 60%);animation:pulse-bg 4s ease-in-out infinite;}
    @keyframes pulse-bg{0%,100%{opacity:0.6}50%{opacity:1}}
    .hero-left{flex:0 0 300px;position:relative;z-index:2;}
    .hero-photo{width:280px;height:360px;object-fit:cover;object-position:top;border-radius:16px;border:2px solid var(--accent);box-shadow:0 0 40px rgba(99,102,241,0.3),-16px 16px 0 rgba(34,211,238,0.08);display:block;}
    .hero-right{flex:1;position:relative;z-index:2;}
    .status{display:inline-flex;align-items:center;gap:0.5rem;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--green);padding:0.4rem 1rem;border-radius:20px;font-size:0.8rem;margin-bottom:1rem;}
    .dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:blink 2s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
    .hero-tag{font-family:'Fira Code',monospace;color:var(--accent2);font-size:0.875rem;margin-bottom:0.75rem;}
    .hero h1{font-size:clamp(2.5rem,5vw,4rem);font-weight:700;line-height:1.1;margin-bottom:0.75rem;}
    .glitch{position:relative;display:inline-block;color:var(--text);}
    .glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;}
    .glitch::before{color:#ff006e;animation:glitch1 4s infinite;clip-path:polygon(0 0,100% 0,100% 35%,0 35%);}
    .glitch::after{color:#00ffff;animation:glitch2 4s infinite;clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);}
    .glitch:hover::before,.glitch:hover::after{opacity:1;}
    @keyframes glitch1{0%,85%,100%{transform:translate(0)}87%{transform:translate(-3px,1px)}89%{transform:translate(3px,-1px)}91%{transform:translate(-2px,2px)}}
    @keyframes glitch2{0%,85%,100%{transform:translate(0)}87%{transform:translate(3px,-1px)}89%{transform:translate(-3px,1px)}91%{transform:translate(2px,-2px)}}
    .typewriter{color:var(--accent2);font-family:'Fira Code',monospace;font-size:1.1rem;margin-bottom:1rem;min-height:1.5rem;}
    .cursor{display:inline-block;width:2px;height:1.1rem;background:var(--accent2);margin-left:2px;animation:blink 1s infinite;vertical-align:middle;}
    .hero-sub{color:var(--muted);font-size:1rem;max-width:500px;margin-bottom:2rem;}
    .hero-btns{display:flex;gap:1rem;flex-wrap:wrap;}
    .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;padding:0.75rem 1.75rem;border-radius:8px;text-decoration:none;font-weight:500;font-size:0.9rem;transition:all 0.2s;}
    .btn-primary:hover{opacity:0.85;transform:translateY(-2px);}
    .btn-outline{border:1px solid var(--border);color:var(--text);padding:0.75rem 1.75rem;border-radius:8px;text-decoration:none;font-weight:500;font-size:0.9rem;transition:all 0.2s;}
    .btn-outline:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-2px);}

    section{padding:5rem 2rem;max-width:1000px;margin:0 auto;position:relative;z-index:1;}
    .section-title{font-size:2rem;font-weight:700;margin-bottom:3rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border);}

    .fade-in{opacity:0;transform:translateY(30px);transition:opacity 0.6s ease,transform 0.6s ease;}
    .fade-in.visible{opacity:1;transform:translateY(0);}
    @media(max-width:900px){.fade-in{opacity:1 !important;transform:none !important;}}

    /* TIMELINE */
    .timeline{position:relative;padding:1rem 0;}
    .timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--accent),var(--accent2));transform:translateX(-50%);}
    .timeline-item{display:flex;justify-content:flex-end;padding-right:calc(50% + 2rem);margin-bottom:2rem;position:relative;}
    .timeline-item:nth-child(even){justify-content:flex-start;padding-right:0;padding-left:calc(50% + 2rem);}
    .timeline-dot{position:absolute;left:50%;top:1.2rem;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--accent2);box-shadow:0 0 12px rgba(99,102,241,0.6);transform:translateX(-50%);}
    .edu-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;width:100%;overflow:hidden;position:relative;transition:border-color 0.3s,transform 0.3s;cursor:default;}
    .edu-card:hover{border-color:var(--accent);transform:scale(1.02);}
    .edu-bg{position:absolute;inset:0;opacity:0;transition:opacity 0.4s;background-size:cover;background-position:center;filter:blur(2px) brightness(0.15);}
    .edu-card:hover .edu-bg{opacity:1;}
    .edu-content{position:relative;z-index:1;}
    .edu-year{font-family:'Fira Code',monospace;color:var(--accent2);font-size:0.78rem;margin-bottom:0.4rem;}
    .edu-title{font-weight:600;font-size:0.95rem;margin-bottom:0.25rem;}
    .edu-school{color:var(--muted);font-size:0.82rem;}

    /* SKILLS */
    .skills-categories{display:flex;flex-direction:column;gap:2rem;}
    .skill-category h4{font-family:'Fira Code',monospace;color:var(--accent2);font-size:0.85rem;margin-bottom:1rem;text-transform:uppercase;letter-spacing:1px;}
    .skills-icons{display:flex;flex-wrap:wrap;gap:1rem;}
    .skill-icon{display:flex;flex-direction:column;align-items:center;gap:0.4rem;padding:0.75rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:10px;transition:all 0.2s;min-width:75px;cursor:default;}
    .skill-icon:hover{border-color:var(--accent2);transform:translateY(-4px);box-shadow:0 4px 20px rgba(34,211,238,0.15);}
    .skill-icon i{font-size:1.8rem;}
    .skill-icon img{width:1.8rem;height:1.8rem;object-fit:contain;}
    .skill-icon span{font-size:0.7rem;color:var(--muted);text-align:center;}

    /* EXPERIENCE */
    .exp-list{display:flex;flex-direction:column;gap:1rem;}
    .exp-card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:1.25rem;cursor:pointer;transition:all 0.2s;}
    .exp-card:hover{border-left-color:var(--accent2);transform:translateX(4px);}
    .exp-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.5rem;}
    .exp-title{font-weight:600;font-size:1rem;}
    .exp-company{color:var(--accent2);font-size:0.875rem;}
    .exp-date{color:var(--muted);font-size:0.8rem;font-family:'Fira Code',monospace;}
    .exp-arrow{color:var(--muted);font-size:0.8rem;margin-top:0.5rem;}

    /* PROJECTS */
    .projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem;}
    .project-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.3s;transform-style:preserve-3d;}
    .project-card:hover{border-color:var(--accent2);transform:translateY(-4px);}
    .project-thumb{width:100%;height:160px;object-fit:cover;display:block;}
    .project-thumb-placeholder{width:100%;height:160px;background:linear-gradient(135deg,var(--bg2),var(--card));display:flex;align-items:center;justify-content:center;font-size:3rem;}
    .project-thumb-video{width:100%;height:160px;object-fit:cover;display:block;background:var(--bg2);}
    .project-body{padding:1.25rem;}
    .project-card h3{font-size:1rem;font-weight:600;margin-bottom:0.5rem;}
    .project-card p{color:var(--muted);font-size:0.82rem;margin-bottom:0.75rem;}
    .tags{display:flex;flex-wrap:wrap;gap:0.4rem;}
    .tag{background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2);color:var(--text);padding:0.2rem 0.5rem;border-radius:4px;font-size:0.72rem;transition:all 0.2s;}
    .tag:hover{background:rgba(99,102,241,0.25);border-color:var(--accent2);color:var(--accent2);}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:750px;width:100%;max-height:90vh;overflow-y:auto;}
    .modal-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1;}
    .modal-header h2{font-size:1.1rem;font-weight:600;}
    .modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.5rem;line-height:1;transition:color 0.2s;}
    .modal-close:hover{color:var(--text);}
    .modal-body{padding:1.5rem;}
    .modal-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.75rem;margin-bottom:1.5rem;}
    .modal-gallery img{width:100%;border-radius:8px;object-fit:contain;max-height:400px;border:1px solid var(--border);background:var(--bg2);}
    .modal-gallery video{width:100%;border-radius:8px;border:1px solid var(--border);max-height:300px;}
    .modal-gallery iframe{width:100%;height:220px;border-radius:8px;border:1px solid var(--border);}
    .modal-desc{color:var(--muted);font-size:0.9rem;line-height:1.7;margin-bottom:1rem;}
    .modal-tags{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;}
    .modal-links{display:flex;gap:0.75rem;flex-wrap:wrap;}
    .modal-link{color:var(--accent2);font-size:0.85rem;text-decoration:none;font-family:'Fira Code',monospace;border:1px solid rgba(34,211,238,0.3);padding:0.4rem 0.875rem;border-radius:6px;transition:all 0.2s;}
    .modal-link:hover{background:rgba(34,211,238,0.1);}

    /* GITHUB STATS */
    .stats-grid{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1.5rem;}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.5rem;text-align:center;min-width:130px;transition:border-color 0.2s;}
    .stat-card:hover{border-color:var(--accent2);}
    .stat-value{font-size:1.75rem;font-weight:700;color:var(--accent2);font-family:'Fira Code',monospace;}
    .stat-label{font-size:0.75rem;color:var(--muted);margin-top:0.25rem;}

    /* CONTACT */
    .contact-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:3rem;text-align:center;}
    .contact-box p{color:var(--muted);margin-bottom:2rem;}
    .contact-icons{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap;}
    .contact-icon{display:flex;flex-direction:column;align-items:center;gap:0.5rem;text-decoration:none;color:var(--muted);transition:all 0.2s;}
    .contact-icon i{font-size:1.5rem;padding:1rem;background:var(--bg2);border:1px solid var(--border);border-radius:12px;transition:all 0.2s;width:56px;height:56px;display:flex;align-items:center;justify-content:center;}
    .contact-icon:hover{color:var(--accent2);}
    .contact-icon:hover i{border-color:var(--accent2);box-shadow:0 0 20px rgba(34,211,238,0.2);transform:translateY(-4px);}
    .contact-icon span{font-size:0.75rem;font-family:'Fira Code',monospace;}

    /* CHATBOT */
    #chatbot-btn{position:fixed;bottom:5rem;right:1.5rem;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;cursor:pointer;font-size:1.3rem;box-shadow:0 4px 20px rgba(99,102,241,0.4);z-index:200;transition:transform 0.2s;display:flex;align-items:center;justify-content:center;}
    #chatbot-btn:hover{transform:scale(1.1);}
    #chatbot{position:fixed;bottom:9rem;right:1.5rem;width:300px;background:var(--card);border:1px solid var(--border);border-radius:16px;z-index:200;display:none;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,0.4);overflow:hidden;}
    .chat-header{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:0.875rem 1rem;color:white;font-size:0.875rem;font-weight:500;display:flex;justify-content:space-between;align-items:center;}
    .chat-close{background:none;border:none;color:white;cursor:pointer;font-size:1rem;}
    .chat-messages{padding:1rem;height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:0.75rem;}
    .chat-msg{padding:0.6rem 0.875rem;border-radius:10px;font-size:0.8rem;max-width:85%;line-height:1.4;}
    .chat-msg.bot{background:var(--bg2);color:var(--text);align-self:flex-start;border:1px solid var(--border);}
    .chat-msg.user{background:var(--accent);color:white;align-self:flex-end;}
    .chat-input-row{display:flex;gap:0.5rem;padding:0.75rem;border-top:1px solid var(--border);}
    .chat-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.75rem;color:var(--text);font-size:0.8rem;outline:none;}
    .chat-input:focus{border-color:var(--accent2);}
    .chat-send{background:var(--accent);border:none;color:white;border-radius:8px;padding:0.5rem 0.75rem;cursor:pointer;font-size:0.8rem;}

    #back-top{position:fixed;bottom:1.5rem;right:1.5rem;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:1rem;display:none;align-items:center;justify-content:center;z-index:200;transition:all 0.2s;}
    #back-top:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-3px);}
    #back-top.show{display:flex;}

    footer{text-align:center;padding:2rem;color:var(--muted);font-size:0.8rem;border-top:1px solid var(--border);position:relative;z-index:1;}

    [data-lang]{display:none;}
    .lang-fr [data-lang="fr"],.lang-en [data-lang="en"]{display:inline;}

    @media(max-width:768px){
      .hero{flex-direction:column;padding:5rem 1.5rem 3rem;text-align:center;gap:1.5rem;min-height:auto;}
      .hero-left{flex:none;display:flex;justify-content:center;}
      .hero-photo{width:160px;height:200px;margin:0 auto;}
      .hero-right{width:100%;}
      .hero-sub{max-width:100%;}
      .hero-btns{justify-content:center;}
      .hero h1{font-size:2.2rem;}
      .timeline::before{left:1rem;}
      .timeline-item,.timeline-item:nth-child(even){padding:0 0 0 3rem;justify-content:flex-start;}
      .timeline-dot{left:1rem;}
      .nav-links{display:none;}
      section{padding:3rem 1rem;}
      .section-title{font-size:1.5rem;}
      .skills-icons{gap:0.75rem;}
      .skill-icon{min-width:60px;padding:0.6rem 0.75rem;}
      .projects-grid{grid-template-columns:1fr;}
      .contact-icons{gap:1rem;}
      .modal{max-height:95vh;}
      #chatbot{width:260px;right:0.75rem;}
    }

    /* CERTIFICATIONS */
    .cert-grid{display:flex;flex-direction:column;gap:0.875rem;}
    .cert-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:1rem;}
    .cert-card:hover{border-color:var(--accent2);transform:translateX(4px);}
    .cert-badge{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .cert-info{flex:1;}
    .cert-title{font-weight:600;font-size:0.95rem;margin-bottom:0.2rem;}
    .cert-issuer{color:var(--accent2);font-size:0.8rem;margin-bottom:0.15rem;}
    .cert-date{color:var(--muted);font-size:0.75rem;font-family:'Fira Code',monospace;}
    .cert-arrow{color:var(--muted);font-size:1.2rem;transition:color 0.2s;}
    .cert-card:hover .cert-arrow{color:var(--accent2);}
    .cert-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem;}
    .cert-overlay.open{display:flex;}
    .cert-modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;}
    .cert-modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1;}
    .cert-modal-header h2{font-size:1rem;font-weight:600;}
    .cert-modal-body{padding:1.5rem;}
  </style>
</head>
<body class="lang-fr">

<div id="progress-bar"></div>
<canvas id="particles"></canvas>

<nav>
  <span class="nav-logo">~/ahmedriaahi</span>
  <ul class="nav-links">
    <li><a href="#education"><span data-lang="fr">Éducation</span><span data-lang="en">Education</span></a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#experience"><span data-lang="fr">Expérience</span><span data-lang="en">Experience</span></a></li>
    <li><a href="#projects"><span data-lang="fr">Projets</span><span data-lang="en">Projects</span></a></li>
    <li><a href="#certifications"><span data-lang="fr">Certifications</span><span data-lang="en">Certifications</span></a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <div class="nav-controls">
    <button class="ctrl-btn" onclick="toggleLang()" id="lang-btn">EN</button>
    <button class="ctrl-btn" onclick="toggleTheme()" id="theme-btn">☀️</button>
  </div>
</nav>

<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-left">
    <img src="assets/photo.jpg" alt="Ahmed Riahi" class="hero-photo" 
      onerror="this.src='https://avatars.githubusercontent.com/u/ahmedriaahi?v=4';this.onerror=null;">
  </div>
  <div class="hero-right">
    <div class=
